{% extends "base.html" %}
{% block actions %}<button id="cancel-run" class="danger hidden">Cancel run</button>{% endblock %}
{% block content %}
<div class="card" id="run-head"></div>
<div class="grid two" style="margin-top:16px">
  <div class="card"><h2>Steps (checkpoints)</h2><div id="run-steps"></div></div>
  <div class="card"><h2>Version &amp; validation</h2><div id="run-version"></div></div>
</div>
<div class="card"><h2>Fetch evidence (one row per attempt)</h2><div id="run-evidence"></div></div>
<div class="card"><h2>Data-quality issues raised</h2><div id="run-issues"></div></div>
{% endblock %}
